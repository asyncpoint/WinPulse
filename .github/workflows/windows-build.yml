name: Windows x64 CI and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check and build Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --verbose

      - name: Check release configuration
        run: cargo check --release --target x86_64-pc-windows-msvc

      - name: Build optimized release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/winpulse.exe dist/WinPulse-windows-x64.exe

      - name: Upload Windows x64 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinPulse-windows-x64
          path: dist/WinPulse-windows-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release asset for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WinPulse-windows-x64.exe
          generate_release_notes: true
